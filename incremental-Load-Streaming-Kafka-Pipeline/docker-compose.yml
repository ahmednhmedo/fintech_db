# Incremental pipeline — Apache Kafka in KRaft mode (no ZooKeeper).
#
# This stack is COMPLETELY SEPARATE from the batch stack in ../docker-compose.yml
# (Airflow + Postgres). It is the event backbone for the streaming fact ingestion:
#
#     FastAPI source  ->  producer.py  ->  [ Kafka topic: transactions_raw ]  ->  consumer.py  ->  Bronze Incremental
#
# Only deviation from the provided base config: an explicit project `name:` so this
# stack never collides with the batch project's containers / volumes / network.
name: fintech_kafka

version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft:/var/lib/kafka/data

volumes:
  kafka_kraft:
